# Tide e2e: builds the stack from source (only what changed), then runs the
# suites in parallel shards, each against its own throwaway stack.
#
# This is the GitHub-hosted path, for nightly and manual runs. It defaults to a
# 5-ORK stack at T=3/N=5, which is what a hosted runner can carry. The BLOCKING
# pre-release gate is a different thing: tidecloak-override runs it on the
# self-hosted Proliant runner at the production threshold (20 ORKs, T=14/N=20)
# and calls ci/run-all.sh directly, with no dispatch here and no sharding.
# Raise ork_count/threshold_t/threshold_n below to do a big nightly run too.
#
#   plan     resolve refs to SHAs, work out image keys, find which images are
#            missing from the registry, pick suites, emit the shard matrix
#   build    one job per missing image, pushed to a PRIVATE GHCR package
#   e2e      one job per shard: pull images, start the stack, run its suites
#   summary  one table for the whole run; fails if any shard failed or never reported
#
# Entry points:
#   workflow_dispatch     by hand, from the Actions tab or `gh workflow run`
#   repository_dispatch   type "tide-e2e", sent by component repos (ci/caller-template.yml)
#   schedule              nightly, full selection
#   workflow_call         the existing release hook in tidecloak-override. It runs on
#                         the CALLER's runners and billing; a private caller gets
#                         the smaller private runners, which this stack does not fit
#                         well. For the hook to run everything it must also pass
#                         STRIPE_TEST_SK and CI_REGISTRY_TOKEN (or `secrets: inherit`).
#
# This repo is public, so its job logs and artifacts are public:
#   - build output from private repos stays in files on the runner
#   - nothing built from private source goes to the Actions cache or artifacts;
#     the private GHCR packages are the only place images live
#   - uploads are test reports and scrubbed logs only, and pass a secret scan first
#
# Secrets (names): CHECKOUT_TOKEN, CI_REGISTRY_TOKEN, STRIPE_TEST_SK
# Variables (names): STRIPE_PRICE, STRIPE_FREE_PRODUCT_ID, STRIPE_PRODUCT_ID,
#   CI_REGISTRY_USER
#
# The Stripe names are prod's, from Tidified/prod/.env1, and gen-stack.sh reads
# exactly those. Do not rename them here on their own: a name this workflow
# exports that gen-stack.sh does not read is simply dropped, and the free price
# in particular is optional, so it goes missing without anything failing.
# Details: README.md, "Continuous integration".
name: Tide e2e
# Callers find their run by the request id in this title (ci/caller-template.yml).
run-name: >-
  Tide e2e ${{ github.event.client_payload.request_id || inputs.component || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      component:
        description: Repo under test (a name from ci/components.tsv), empty for none
        required: false
        type: string
      component_ref:
        description: Branch or tag of that repo
        required: false
        type: string
      changed_paths:
        description: Changed paths in that repo, space separated (empty means all of it)
        required: false
        type: string
      base_ref:
        description: Base branch to diff against when changed_paths is empty
        required: false
        type: string
      selection:
        description: affected runs what the change touches; smoke runs a quick subset of that; full runs everything
        required: false
        default: affected
        type: choice
        options: [affected, smoke, full]
      refs:
        description: Other repos at non-default refs, e.g. "ork=my-branch tide-js=v1.2.3"
        required: false
        type: string
      run_docs:
        description: Also run the SDK docs suite (needs tide-test-cases published)
        required: false
        default: false
        type: boolean
      asgard_examples:
        description: Run the three Asgard example specs (14, 15, 16). Off by default; they need the example stacks
        required: false
        default: false
        type: boolean
      key_salt:
        description: Change to force a rebuild of every image
        required: false
        type: string
      ork_count:
        description: How many ORKs the stack runs (5 fits a hosted runner; the gate uses 20)
        required: false
        default: '5'
        type: string
      threshold_t:
        description: Signing threshold T
        required: false
        default: '3'
        type: string
      threshold_n:
        description: Cohort size N. Must not be above ork_count
        required: false
        default: '5'
        type: string
  repository_dispatch:
    types: [tide-e2e]
  schedule:
    # 15:30 UTC, early morning in Australia.
    - cron: '30 15 * * *'
  workflow_call:
    inputs:
      # Accepted for the existing release hook. The current suites do not use email.
      mailslurp_inbox_id:
        required: false
        type: string
      smtp_host:
        required: false
        type: string
      smtp_port:
        required: false
        type: string
      temp_email_debug_mail:
        required: false
        type: string
      temp_email_from:
        required: false
        type: string
      test_user_email:
        required: false
        type: string
      component:
        required: false
        type: string
      component_ref:
        required: false
        type: string
      changed_paths:
        required: false
        type: string
      base_ref:
        required: false
        type: string
      selection:
        description: affected, smoke or full (default full)
        required: false
        type: string
      refs:
        required: false
        type: string
      run_docs:
        required: false
        default: false
        type: boolean
      key_salt:
        required: false
        type: string
      ork_count:
        required: false
        type: string
      threshold_t:
        required: false
        type: string
      threshold_n:
        required: false
        type: string
      stripe_price:
        required: false
        type: string
      stripe_free_product_id:
        required: false
        type: string
      stripe_product_id:
        required: false
        type: string
    secrets:
      CHECKOUT_TOKEN:
        required: false
        description: Read access to the private Tide repos
      MAILSLURP_API:
        required: false
      TEMP_EMAIL_PASSWORD:
        required: false
      GMAIL_APP_PASSWORD:
        required: false
        description: App password for the vars.GMAIL_ADDRESS inbox; without it the account-recovery spec skips
      STRIPE_TEST_SK:
        required: false
        description: Stripe test-mode key for the stack; without it licensing flows fail
      CI_REGISTRY_TOKEN:
        required: false
        description: read/write:packages for the private tide-ci images; without it one job builds everything

permissions:
  contents: read

concurrency:
  group: >-
    tide-e2e-${{ github.repository }}-${{ github.event_name }}-${{ inputs.component || github.event.client_payload.component }}-${{ inputs.component_ref || github.event.client_payload.component_ref || github.ref }}
  # Supersede our own dispatch and scheduled runs; never cancel a caller's run.
  cancel-in-progress: ${{ github.repository == 'tide-foundation/tidecloak-test-cases' }}

env:
  # Toolchains. Keep these in step with tidecloak-override/Tidified/ci/README.md.
  NODE_VERSION: '24'
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: temurin
  DOTNET_VERSION: '8.0.x'
  # Images live at <prefix>-<image>:<key>. The packages must stay private.
  REGISTRY_PREFIX: ghcr.io/tide-foundation/tide-ci
  # Sharding.
  TEST_CASES_SHARDS: '4'
  ADMIN_RUNTIME_SHARDS: '3'
  # Runtime projects kept out of the partitions and run together in one shard.
  ADMIN_RUNTIME_SERIAL_PROJECTS: runtime-serial runtime-social
  # Smoke runs of the admin runtime lane (the suite's own test:smoke selection).
  ADMIN_RUNTIME_SMOKE_GREP: '@smoke'
  CI_REPO: tide-foundation/tidecloak-test-cases
  # Stack size. The hosted runners get the small stack; the 20-ORK production
  # threshold runs on the self-hosted gate in tidecloak-override.
  ORK_COUNT: ${{ inputs.ork_count || github.event.client_payload.ork_count || '5' }}
  TIDE_THRESHOLD_T: ${{ inputs.threshold_t || github.event.client_payload.threshold_t || '3' }}
  TIDE_THRESHOLD_N: ${{ inputs.threshold_n || github.event.client_payload.threshold_n || '5' }}
  # The Asgard example specs (14, 15, 16) are opt-in: '1' runs them, anything else skips them.
  # Set by the asgard_examples input (manual run) or the asgard_examples client_payload field (override dispatch).
  ASGARD_EXAMPLES: ${{ (inputs.asgard_examples || github.event.client_payload.asgard_examples) && '1' || '' }}
  # No caching anywhere: images come from the private registry, npm and browser
  # downloads are fetched fresh. Caching public npm/Playwright downloads is a
  # possible later speed-up; anything built from private source never is.

jobs:
  plan:
    name: plan
    # Never for forks: not scheduled runs in a fork, not fork pull requests of a caller.
    if: >-
      github.repository_owner == 'tide-foundation' &&
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_shards: ${{ steps.plan.outputs.has_shards }}
      suites: ${{ steps.plan.outputs.suites }}
      selection: ${{ steps.plan.outputs.selection }}
      registry_mode: ${{ steps.plan.outputs.registry_mode }}
      registry_prefix: ${{ steps.plan.outputs.registry_prefix }}
      shas: ${{ steps.plan.outputs.shas }}
      image_refs: ${{ steps.plan.outputs.image_refs }}
      image_keys: ${{ steps.plan.outputs.image_keys }}
      build_images: ${{ steps.plan.outputs.build_images }}
      tc_npm_version: ${{ steps.plan.outputs.tc_npm_version }}
      key_salt: ${{ steps.plan.outputs.key_salt }}
    steps:
      - name: Check out the CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CI_REPO }}
          ref: ${{ github.repository == 'tide-foundation/tidecloak-test-cases' && github.sha || 'main' }}
          path: self
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Log in to GHCR to look up existing images
        env:
          REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ vars.CI_REGISTRY_USER || 'tide-ci' }}
        run: |
          if [ -n "$REGISTRY_TOKEN" ]; then
            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          else
            echo "::warning::CI_REGISTRY_TOKEN is not available: one job will build every image and run all suites"
          fi

      - name: Plan the run
        id: plan
        env:
          GH_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
          # A called run reports the caller's event; treat it as the release hook.
          EVENT_NAME: ${{ github.repository == 'tide-foundation/tidecloak-test-cases' && github.event_name || 'workflow_call' }}
          IN_COMPONENT: ${{ inputs.component || github.event.client_payload.component }}
          IN_COMPONENT_REF: ${{ inputs.component_ref || github.event.client_payload.component_ref }}
          IN_CHANGED_PATHS: ${{ inputs.changed_paths || join(github.event.client_payload.changed_paths, ' ') }}
          IN_BASE_REF: ${{ inputs.base_ref || github.event.client_payload.base_ref }}
          IN_SELECTION: ${{ inputs.selection || github.event.client_payload.selection || (github.event_name == 'schedule' && 'full') || '' }}
          IN_REFS: ${{ inputs.refs || github.event.client_payload.refs }}
          IN_RUN_DOCS: ${{ inputs.run_docs || github.event.client_payload.run_docs || false }}
          IN_KEY_SALT: ${{ inputs.key_salt || github.event.client_payload.key_salt }}
          HAS_REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN != '' }}
          PLAN_FILE: ${{ runner.temp }}/plan.json
          PLAN_WORKSPACE: ${{ runner.temp }}/plan-ws
        run: self/ci/plan.sh

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true

  build:
    name: build (${{ matrix.image }})
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.build_images != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.image == 'tidecloak' && 90 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.build_images) }}
    env:
      TIDE_WORKSPACE: ${{ github.workspace }}/ws
      CI_SHAS: ${{ needs.plan.outputs.shas }}
      IMAGE: ${{ matrix.image }}
      TC_NPM_VERSION: ${{ needs.plan.outputs.tc_npm_version }}
      CI_KEY_SALT: ${{ needs.plan.outputs.key_salt }}
    steps:
      - name: Check out the CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CI_REPO }}
          ref: ${{ github.repository == 'tide-foundation/tidecloak-test-cases' && github.sha || 'main' }}
          path: self
          persist-credentials: false

      - name: Free disk space
        env:
          LEVEL: ${{ matrix.image == 'tidecloak' && 'full' || 'light' }}
        run: self/ci/free-disk.sh "$LEVEL"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # No `cache:` on purpose: the Maven cache would store artifacts built from private forks.
      - name: Set up Java
        if: matrix.image == 'tidecloak'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache-jdk: false

      - name: Set up .NET
        if: matrix.image == 'tidecloak'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: false

      - name: Install native build tools
        if: matrix.image == 'tidecloak'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang zlib1g-dev jq

      - name: Check out the sources for this image
        env:
          GH_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
        run: |
          mkdir -p "$TIDE_WORKSPACE"
          self/ci/checkout.sh tidecloak-override
          # shellcheck disable=SC2046
          self/ci/checkout.sh $(self/ci/image-repos.sh "$IMAGE")

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ vars.CI_REGISTRY_USER || 'tide-ci' }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Build and push ${{ matrix.image }}
        env:
          GH_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
          IMAGE_KEYS: ${{ needs.plan.outputs.image_keys }}
          PREFIX: ${{ needs.plan.outputs.registry_prefix }}
        run: |
          EXPECTED_KEY="$(node -e 'process.stdout.write(JSON.parse(process.env.IMAGE_KEYS)[process.env.IMAGE])')"
          export EXPECTED_KEY
          self/ci/build-image.sh "$IMAGE" --push "$PREFIX"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true

  e2e:
    name: e2e (${{ matrix.id }})
    needs: [plan, build]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.has_shards == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TIDE_WORKSPACE: ${{ github.workspace }}/ws
      CI_SHARD_ID: ${{ matrix.id }}
      SUITES: ${{ matrix.suites }}
      SUITE_MODE: ${{ matrix.mode }}
      SUITE_GREP: ${{ matrix.grep }}
      SUITE_GREP_INVERT: ${{ matrix.grep_invert }}
      SUITE_SHARD: ${{ matrix.shard }}
      SUITE_PARTITION: ${{ matrix.partition }}
      SUITE_PROJECTS: ${{ matrix.projects }}
      CI_SHAS: ${{ needs.plan.outputs.shas }}
      TC_NPM_VERSION: ${{ needs.plan.outputs.tc_npm_version }}
      CI_KEY_SALT: ${{ needs.plan.outputs.key_salt }}
    steps:
      - name: Check out the CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CI_REPO }}
          ref: ${{ github.repository == 'tide-foundation/tidecloak-test-cases' && github.sha || 'main' }}
          path: self
          persist-credentials: false

      - name: Free disk space
        env:
          LEVEL: ${{ matrix.build_local && 'full' || 'light' }}
        run: self/ci/free-disk.sh "$LEVEL"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Java
        if: matrix.build_local
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache-jdk: false

      - name: Set up .NET
        if: matrix.build_local
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: false

      - name: Install native build tools
        if: matrix.build_local
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang zlib1g-dev jq

      - name: Point hostgateway at this runner
        run: self/ci/add-hostgateway.sh

      - name: Check out the repos this shard needs
        env:
          GH_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
          COMPONENTS: ${{ matrix.components }}
        run: |
          mkdir -p "$TIDE_WORKSPACE"
          # shellcheck disable=SC2086
          self/ci/checkout.sh $COMPONENTS

      - name: Log in to GHCR
        if: ${{ !matrix.build_local }}
        env:
          REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ vars.CI_REGISTRY_USER || 'tide-ci' }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Get the stack images
        id: images
        env:
          IMAGE_REFS: ${{ needs.plan.outputs.image_refs }}
          MODE: ${{ matrix.build_local && 'build-local' || 'pull' }}
        run: self/ci/images.sh "$MODE"

      - name: Start the stack
        id: stack
        env:
          # gen-stack.sh reads these; stack-up.sh checks them first.
          ORK_COUNT: ${{ env.ORK_COUNT }}
          TIDE_THRESHOLD_T: ${{ env.TIDE_THRESHOLD_T }}
          TIDE_THRESHOLD_N: ${{ env.TIDE_THRESHOLD_N }}
          # gen-stack.sh needs the test key and both product ids. The price is
          # optional: the ORK resolves the free price from the free product at
          # runtime, so an unset one is better than a guessed one.
          STRIPE_TEST_SK: ${{ secrets.STRIPE_TEST_SK }}
          STRIPE_PRICE: ${{ inputs.stripe_price || vars.STRIPE_PRICE }}
          STRIPE_FREE_PRODUCT_ID: ${{ inputs.stripe_free_product_id || vars.STRIPE_FREE_PRODUCT_ID }}
          STRIPE_PRODUCT_ID: ${{ inputs.stripe_product_id || vars.STRIPE_PRODUCT_ID }}
          # The ORKs send the account-recovery emails through this Gmail account.
          GMAIL_ADDRESS: ${{ vars.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: self/ci/stack-up.sh

      - name: Install suite dependencies
        id: prepare
        run: self/ci/prepare-suites.sh

      - name: Build the SDK packages and the test-app
        id: sdk
        if: contains(format(' {0} ', matrix.suites), ' test-cases ')
        run: self/ci/build-sdk.sh

      - name: Wait for the stack
        id: ready
        run: self/ci/stack-wait.sh

      - name: 'Suite: iga-engine'
        id: iga_engine
        if: always() && steps.ready.outcome == 'success' && contains(format(' {0} ', matrix.suites), ' iga-engine ')
        timeout-minutes: 30
        run: self/ci/run-iga-engine.sh

      - name: 'Suite: tidecloak-test-cases'
        id: test_cases
        if: always() && steps.ready.outcome == 'success' && contains(format(' {0} ', matrix.suites), ' test-cases ')
        timeout-minutes: 90
        env:
          # Spec 13 reads the recovery emails from this inbox over IMAP.
          GMAIL_ADDRESS: ${{ vars.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: self/ci/run-test-cases.sh

      # ---- Spec 16 (Asgard ResourceToResourceDelegation) -------------------------------------
      # Runs automatically alongside the rest of the test-cases suite, on whichever shard draws
      # it - it needs its own checkouts (five extra repos) and docker-compose stack, which the
      # main test-cases run (ci/run-test-cases.sh, below) doesn't set up, so it is its own step
      # group rather than one more spec file in that run. Spec 16 needs two REQUEST_SERVER_CERT
      # change requests approved in the Tide enclave: the webapp_backend client and the analytics
      # client. The spec itself authorizes them (realm-setup grants asgard-tide-user
      # tide-realm-admin, and the spec drives the real admin console's Change Requests page
      # through the enclave popup) - see utils/asgardExample.js's approveServerCertRequests -
      # so no manual approval is needed. The whole group is opt-in via the asgard_examples flag
      # (env ASGARD_EXAMPLES=1); every later step in the group depends on this first step's outcome.
      - name: 'Spec 16 setup: check out the Asgard repo'
        id: r2r_asgard
        if: always() && env.ASGARD_EXAMPLES == '1' && steps.ready.outcome == 'success' && contains(format(' {0} ', matrix.suites), ' test-cases ')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tide-foundation/asgard
          token: ${{ secrets.CHECKOUT_TOKEN }}
          path: ws/asgard
          persist-credentials: false

      - name: 'Spec 16 setup: check out the build contexts (ork, tide-js, heimdall, tidecloak-js)'
        id: r2r_contexts
        if: always() && steps.r2r_asgard.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tide-foundation/ork
          token: ${{ secrets.CHECKOUT_TOKEN }}
          path: ws/project/ork
          persist-credentials: false

      - name: 'Spec 16 setup: check out tide-js (both the SDK build path and the image path)'
        id: r2r_tidejs
        if: always() && steps.r2r_contexts.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tide-foundation/tide-js
          token: ${{ secrets.CHECKOUT_TOKEN }}
          path: ws/tide-js
          persist-credentials: false

      - name: 'Spec 16 setup: check out tide-js into the image path'
        id: r2r_tidejs_image
        if: always() && steps.r2r_tidejs.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tide-foundation/tide-js
          token: ${{ secrets.CHECKOUT_TOKEN }}
          path: ws/project/tide-js
          persist-credentials: false

      - name: 'Spec 16 setup: check out heimdall and tidecloak-js'
        id: r2r_sdk_repos
        if: always() && steps.r2r_tidejs_image.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tide-foundation/heimdall
          token: ${{ secrets.CHECKOUT_TOKEN }}
          path: ws/heimdall
          persist-credentials: false

      - name: 'Spec 16 setup: check out tidecloak-js'
        id: r2r_tidecloak_js
        if: always() && steps.r2r_sdk_repos.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tide-foundation/tidecloak-js
          token: ${{ secrets.CHECKOUT_TOKEN }}
          path: ws/tidecloak-js
          persist-credentials: false

      - name: 'Spec 16 setup: build the SDK packages for the image contexts'
        id: r2r_sdk_build
        if: always() && steps.r2r_tidecloak_js.outcome == 'success'
        env:
          SDK_STEPS: tide-js heimdall tidecloak-js
        run: self/ci/build-sdk.sh

      - name: 'Spec 16 setup: point the SDK links at the image layout'
        id: r2r_links
        if: always() && steps.r2r_sdk_build.outcome == 'success'
        run: |
          # Inside the image the SDK packages sit at /root/<name>, and tide-js at /root/project/tide-js
          # (the Dockerfiles' COPY layout). The host links point at the workspace, so re-point the two
          # that go through tide-js. Same fix as the scratch copies used locally.
          ws="$TIDE_WORKSPACE"
          ln -sfn ../../../project/tide-js "$ws/heimdall/node_modules/@tideorg/js"
          ln -sfn ../../../../../project/tide-js "$ws/tidecloak-js/packages/tidecloak-js/node_modules/@tideorg/js"

      - name: 'Spec 16 setup: provision the Asgard realm (setup output, reused by the spec)'
        id: r2r_realm
        if: always() && steps.r2r_links.outcome == 'success'
        run: |
          stack_dir="$RUNNER_TEMP/tide-stack"
          set -a
          . "$stack_dir/.env.ci"
          . "$stack_dir/stack.env"
          set +a
          # Per-run password for the Tide user: generated here, masked, never stored in the repo.
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "TIDE_USER_PASSWORD=$pw" >> "$GITHUB_ENV"
          export TIDE_USER_PASSWORD="$pw"
          cd "$GITHUB_WORKSPACE/self/tests"
          realm="$(node -e "require('./utils/asgardExample').provisionAsgardRealm().then(r => process.stdout.write(r.realm))")"
          test -n "$realm" || { echo "no realm from setup"; exit 1; }
          echo "TIDECLOAK_REALM=$realm" >> "$GITHUB_ENV"
          echo "Provisioned realm: $realm"

      - name: 'Spec 16 setup: write the realm adapter configs into the example (fresh enrollment tokens)'
        id: r2r_configs
        if: always() && steps.r2r_realm.outcome == 'success'
        working-directory: self/tests
        run: |
          stack_dir="$RUNNER_TEMP/tide-stack"
          set -a
          . "$stack_dir/.env.ci"
          . "$stack_dir/stack.env"
          set +a
          node -e "require('./utils/asgardExample').writeR2RAdapterConfigs(process.env.TIDECLOAK_REALM, process.argv[1]).then(r => console.log('adapter configs written for', r.realm))" \
            "$GITHUB_WORKSPACE/ws/asgard/aspnet/Tide.Asgard.AspNetCore/Examples/ResourceToResourceDelegation"

      - name: 'Spec 16 example: start the ResourceToResourceDelegation compose stack'
        id: r2r_up
        if: always() && steps.r2r_configs.outcome == 'success'
        working-directory: ws/asgard/aspnet/Tide.Asgard.AspNetCore/Examples/ResourceToResourceDelegation
        run: |
          printf 'TIDECLOAK_REALM=%s\n' "$TIDECLOAK_REALM" > .env
          docker compose -f compose.yaml up -d --build
          for _ in $(seq 1 60); do
            state="$(docker compose -f compose.yaml ps --format '{{.Service}} {{.State}}')"
            echo "$state"
            if echo "$state" | grep -q '^webapp running' && echo "$state" | grep -q '^analytics running'; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f compose.yaml logs --no-color || true
          exit 1

      - name: 'Suite: spec 16 (ResourceToResourceDelegation)'
        id: r2r_spec
        if: always() && steps.r2r_up.outcome == 'success'
        timeout-minutes: 30
        env:
          CI: 'true'
          HEADLESS: 'true'
          PW_SKIP_BUILD: '1'
          TEST_APP_PORT: '3100'
          # spec 16 runs only with its compose stack, which this step builds (the S2 gate sets ASGARD_EXAMPLES alone)
          ASGARD_R2R: '1'
        working-directory: self/tests
        run: |
          stack_dir="$RUNNER_TEMP/tide-stack"
          set -a
          . "$stack_dir/.env.ci"
          . "$stack_dir/stack.env"
          set +a
          export ASGARD_REALM="$TIDECLOAK_REALM" PORT="$TEST_APP_PORT" BASE_URL="http://localhost:$TEST_APP_PORT"
          npx playwright test specs/16-asgard-resource-to-resource-delegation.spec.js --project=firefox

      - name: 'Spec 16 teardown: stop the compose stack (no volumes)'
        if: always() && steps.r2r_asgard.outcome == 'success'
        working-directory: ws/asgard/aspnet/Tide.Asgard.AspNetCore/Examples/ResourceToResourceDelegation
        run: |
          if [ -f compose.yaml ]; then docker compose -f compose.yaml down --remove-orphans || true; fi
          rm -f .env

      # ---- Specs 14 and 15 (Asgard StandardResourceDelegation and LockingUserDataWithTide) ----------
      # Each example is a .NET app served on :3000, so they run one after the other, after spec 16's
      # stack is down. They share one realm (the recipe covers all three examples). The generic
      # test-cases run skips them: they need ASGARD_EXAMPLE_SERVERS=1, which only these steps set.
      - name: 'Spec 14/15 setup: install .NET 10 for the example servers'
        id: ex_dotnet
        if: always() && env.ASGARD_EXAMPLES == '1' && steps.r2r_sdk_build.outcome == 'success' && contains(format(' {0} ', matrix.suites), ' test-cases ')
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: 'Spec 14/15 setup: provision one Asgard realm for both examples'
        id: ex_realm
        if: always() && steps.ex_dotnet.outcome == 'success'
        working-directory: self/tests
        run: |
          stack_dir="$RUNNER_TEMP/tide-stack"
          set -a
          . "$stack_dir/.env.ci"
          . "$stack_dir/stack.env"
          set +a
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "TIDE_USER_PASSWORD=$pw" >> "$GITHUB_ENV"
          export TIDE_USER_PASSWORD="$pw"
          realm="$(node -e "require('./utils/asgardExample').provisionAsgardRealm().then(r => process.stdout.write(r.realm))")"
          test -n "$realm" || { echo "no realm from setup"; exit 1; }
          echo "ASGARD_REALM=$realm" >> "$GITHUB_ENV"
          echo "Provisioned realm: $realm"

      - name: 'Spec 14/15 setup: name the realm and hostgateway on the runner (as the example README says)'
        if: always() && steps.ex_realm.outcome == 'success'
        run: |
          sudo sh -c "echo '127.0.0.1 $ASGARD_REALM.client.localhost' >> /etc/hosts"
          sudo sh -c "echo '127.0.0.1 hostgateway' >> /etc/hosts"

      - name: 'Spec 14/15 setup: point the example client links at the workspace tidecloak-js'
        id: ex_links
        if: always() && steps.ex_realm.outcome == 'success'
        run: |
          for dir in ws/asgard/aspnet/Tide.Asgard.AspNetCore/Examples/StandardResourceDelegation/standardresourcedelegation.client ws/asgard/aspnet/Tide.Asgard.AspNetCore/Examples/LockingUserDataWithTide/lockinguserdatawithtide.client; do
            sed -i "s#\"@tidecloak/js\": \"file:[^\"]*\"#\"@tidecloak/js\": \"file:$TIDE_WORKSPACE/tidecloak-js/packages/tidecloak-js\"#" "$GITHUB_WORKSPACE/$dir/package.json"
            grep -q "$TIDE_WORKSPACE/tidecloak-js" "$GITHUB_WORKSPACE/$dir/package.json"
          done

      - name: 'Spec 14 example: write its adapter configs, build the client and server, start it'
        id: ex14_up
        if: always() && steps.ex_links.outcome == 'success'
        working-directory: self/tests
        run: |
          stack_dir="$RUNNER_TEMP/tide-stack"
          set -a
          . "$stack_dir/.env.ci"
          . "$stack_dir/stack.env"
          set +a
          ex="$GITHUB_WORKSPACE/ws/asgard/aspnet/Tide.Asgard.AspNetCore/Examples/StandardResourceDelegation"
          node -e "require('./utils/asgardExample').writeExampleAdapterConfigs(process.env.ASGARD_REALM, process.argv[1], [
            { clientId: 'backend', file: 'StandardResourceDelegation.Server/appsettings.json', kind: 'keycloak' },
            { clientId: 'browser-login-page', file: 'standardresourcedelegation.client/tidecloak.json', kind: 'client' },
          ]).then(r => console.log('written', r.written))" "$ex"
          (cd "$ex/standardresourcedelegation.client" && npm install --no-audit --no-fund && npx vite build)
          (cd "$ex/StandardResourceDelegation.Server" && dotnet build -c Debug)
          for i in $(seq 1 30); do ss -ltn | grep -q ':3000 ' || break; sleep 1; done
          cd "$ex/StandardResourceDelegation.Server"; nohup dotnet run --no-build --launch-profile http > "$RUNNER_TEMP/ex14.log" 2>&1 & echo $! > "$RUNNER_TEMP/ex14.pid"; cd "$GITHUB_WORKSPACE"
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)"
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/ex14.log" || true
          exit 1

      - name: 'Suite: spec 14 (StandardResourceDelegation)'
        id: ex14_spec
        if: always() && steps.ex14_up.outcome == 'success'
        timeout-minutes: 30
        env:
          CI: 'true'
          HEADLESS: 'true'
          PW_SKIP_BUILD: '1'
          TEST_APP_PORT: '3100'
          ASGARD_EXAMPLES: '1'
          ASGARD_EXAMPLE_SERVERS: '1'
        working-directory: self/tests
        run: npx playwright test specs/14-asgard-standard-resource-delegation.spec.js --project=firefox

      - name: 'Spec 14 example: stop the server'
        if: always() && steps.ex14_up.outcome == 'success'
        run: |
          pid="$(cat "$RUNNER_TEMP/ex14.pid" 2>/dev/null || true)"
          [ -n "$pid" ] && kill "$pid" 2>/dev/null || true
          kill_tree() { for c in $(pgrep -P "$1" 2>/dev/null); do kill_tree "$c"; done; kill "$1" 2>/dev/null || true; }
          pid="$(cat "$RUNNER_TEMP/ex14.pid" 2>/dev/null || true)"
          [ -n "$pid" ] && kill_tree "$pid"
          for i in $(seq 1 30); do ss -ltn | grep -q ':3000 ' || break; sleep 1; done

      - name: 'Spec 15 example: write its adapter configs, build the client and server, start it'
        id: ex15_up
        if: always() && steps.ex_links.outcome == 'success'
        working-directory: self/tests
        run: |
          stack_dir="$RUNNER_TEMP/tide-stack"
          set -a
          . "$stack_dir/.env.ci"
          . "$stack_dir/stack.env"
          set +a
          ex="$GITHUB_WORKSPACE/ws/asgard/aspnet/Tide.Asgard.AspNetCore/Examples/LockingUserDataWithTide"
          node -e "require('./utils/asgardExample').writeExampleAdapterConfigs(process.env.ASGARD_REALM, process.argv[1], [
            { clientId: 'lock_backend', file: 'LockingUserDataWithTide.Server/appsettings.json', kind: 'keycloak' },
            { clientId: 'browser-login-page', file: 'lockinguserdatawithtide.client/tidecloak.json', kind: 'client' },
          ]).then(r => console.log('written', r.written))" "$ex"
          (cd "$ex/lockinguserdatawithtide.client" && npm install --no-audit --no-fund && npx vite build)
          (cd "$ex/LockingUserDataWithTide.Server" && dotnet build -c Debug)
          for i in $(seq 1 30); do ss -ltn | grep -q ':3000 ' || break; sleep 1; done
          cd "$ex/LockingUserDataWithTide.Server"; nohup dotnet run --no-build --launch-profile http > "$RUNNER_TEMP/ex15.log" 2>&1 & echo $! > "$RUNNER_TEMP/ex15.pid"; cd "$GITHUB_WORKSPACE"
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)"
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/ex15.log" || true
          exit 1

      - name: 'Suite: spec 15 (LockingUserDataWithTide)'
        id: ex15_spec
        if: always() && steps.ex15_up.outcome == 'success'
        timeout-minutes: 30
        env:
          CI: 'true'
          HEADLESS: 'true'
          PW_SKIP_BUILD: '1'
          TEST_APP_PORT: '3100'
          ASGARD_EXAMPLES: '1'
          ASGARD_EXAMPLE_SERVERS: '1'
        working-directory: self/tests
        run: npx playwright test specs/15-asgard-locking-user-data.spec.js --project=firefox

      - name: 'Spec 15 example: stop the server'
        if: always() && steps.ex15_up.outcome == 'success'
        run: |
          pid="$(cat "$RUNNER_TEMP/ex15.pid" 2>/dev/null || true)"
          [ -n "$pid" ] && kill "$pid" 2>/dev/null || true
          kill_tree() { for c in $(pgrep -P "$1" 2>/dev/null); do kill_tree "$c"; done; kill "$1" 2>/dev/null || true; }
          pid="$(cat "$RUNNER_TEMP/ex15.pid" 2>/dev/null || true)"
          [ -n "$pid" ] && kill_tree "$pid"
          for i in $(seq 1 30); do ss -ltn | grep -q ':3000 ' || break; sleep 1; done

      - name: 'Suite: tide-admin-ui bootstrap'
        id: admin_bootstrap
        if: always() && steps.ready.outcome == 'success' && contains(format(' {0} ', matrix.suites), ' admin-bootstrap ')
        timeout-minutes: 30
        run: self/ci/run-admin-e2e.sh bootstrap

      - name: 'Suite: tide-admin-ui runtime'
        id: admin_runtime
        if: always() && steps.ready.outcome == 'success' && contains(format(' {0} ', matrix.suites), ' admin-runtime ')
        timeout-minutes: 90
        run: self/ci/run-admin-e2e.sh runtime

      - name: 'Suite: SDK docs'
        id: docs
        if: always() && steps.ready.outcome == 'success' && contains(format(' {0} ', matrix.suites), ' docs ')
        timeout-minutes: 120
        run: self/ci/run-docs.sh

      - name: Collect scrubbed stack logs
        if: always() && steps.stack.outcome != 'skipped'
        run: self/ci/collect-logs.sh

      - name: Stage reports for upload
        if: always()
        run: self/ci/stage-uploads.sh

      - name: Scan staged files for secrets
        id: scan
        if: always()
        env:
          SCAN_SECRET_ENVS: KC_ADMIN_PASSWORD STRIPE_TEST_SK CHECKOUT_TOKEN CI_REGISTRY_TOKEN MAILSLURP_API TEMP_EMAIL_PASSWORD GMAIL_APP_PASSWORD
          STRIPE_TEST_SK: ${{ secrets.STRIPE_TEST_SK }}
          CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
          CI_REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
          MAILSLURP_API: ${{ secrets.MAILSLURP_API }}
          TEMP_EMAIL_PASSWORD: ${{ secrets.TEMP_EMAIL_PASSWORD }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: self/ci/scan-uploads.sh "$RUNNER_TEMP/tide-upload"

      - name: Upload reports
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-reports-${{ matrix.id }}
          path: ${{ runner.temp }}/tide-upload/reports
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: false

      - name: Upload suite status
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-status-${{ matrix.id }}
          path: ${{ runner.temp }}/tide-upload/status
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: false

      - name: Show this shard's results
        if: always()
        run: self/ci/summarize.sh || true

      - name: Stop the stack
        if: always()
        run: self/ci/stack-down.sh

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true

      - name: Fail if a suite failed
        if: always()
        env:
          OUTCOMES: >-
            images=${{ steps.images.outcome }}
            stack=${{ steps.stack.outcome }}
            prepare=${{ steps.prepare.outcome }}
            sdk=${{ steps.sdk.outcome }}
            ready=${{ steps.ready.outcome }}
            iga-engine=${{ steps.iga_engine.outcome }}
            test-cases=${{ steps.test_cases.outcome }}
            r2r-spec16=${{ steps.r2r_spec.outcome }}
            admin-bootstrap=${{ steps.admin_bootstrap.outcome }}
            admin-runtime=${{ steps.admin_runtime.outcome }}
            docs=${{ steps.docs.outcome }}
            scan=${{ steps.scan.outcome }}
        run: |
          echo "$OUTCOMES" | tr ' ' '\n'
          if echo "$OUTCOMES" | grep -Eq '=(failure|cancelled)'; then
            exit 1
          fi

  summary:
    name: summary
    needs: [plan, build, e2e]
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Stop if planning failed
        if: needs.plan.result != 'success'
        run: |
          echo "::error::the plan job did not succeed, so nothing was tested"
          exit 1

      - name: Check out the CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CI_REPO }}
          ref: ${{ github.repository == 'tide-foundation/tidecloak-test-cases' && github.sha || 'main' }}
          path: self
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Download suite status
        if: needs.plan.outputs.has_shards == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-status-*
          path: ${{ runner.temp }}/status

      - name: Write the summary
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          HAS_SHARDS: ${{ needs.plan.outputs.has_shards }}
          BUILD_IMAGES: ${{ needs.plan.outputs.build_images }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          BUILDS="$(node -e '
            const images = JSON.parse(process.env.BUILD_IMAGES || "[]");
            const out = {};
            for (const i of images) out[i] = process.env.BUILD_RESULT;
            process.stdout.write(JSON.stringify(out));
          ')"
          if [ "$HAS_SHARDS" != true ]; then
            echo "Nothing to test for this change." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$MATRIX" > "$RUNNER_TEMP/matrix.json"
          # Each artifact downloads to status/<artifact>/<suite>.json; summarize.js
          # looks for files in folders named "status", so give it that shape.
          mkdir -p "$RUNNER_TEMP/combined"
          for d in "$RUNNER_TEMP"/status/e2e-status-*; do
            [ -d "$d" ] || continue
            mkdir -p "$RUNNER_TEMP/combined/$(basename "$d")/status"
            cp "$d"/*.json "$RUNNER_TEMP/combined/$(basename "$d")/status/" 2>/dev/null || true
          done
          self/ci/summarize.sh "$RUNNER_TEMP/combined" --expect "$RUNNER_TEMP/matrix.json" --builds "$BUILDS"
